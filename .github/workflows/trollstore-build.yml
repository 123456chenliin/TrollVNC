name: Build TrollVNC for TrollStore

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  FINALPACKAGE: 1
  HOMEBREW_NO_AUTO_UPDATE: 1
  HOMEBREW_NO_INSTALLED_DEPENDENTS_CHECK: 1

jobs:
  build-trollstore:
    runs-on: macos-15
    timeout-minutes: 40
    steps:
      - name: Checkout TrollVNC
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install build dependencies
        run: brew install xcbeautify ldid-procursus p7zip make

      - name: Checkout the upstream Theos toolchain
        uses: actions/checkout@v4
        with:
          repository: roothide/theos
          path: theos-roothide
          submodules: recursive

      - name: Install the upstream iOS SDKs
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          export THEOS="$GITHUB_WORKSPACE/theos-roothide"
          cd "$THEOS"
          ./bin/install-sdk iPhoneOS16.5
          ./bin/install-sdk iPhoneOS14.5

      - name: Select Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: "16.4"

      - name: Build the TrollStore package
        run: |
          source devkit/bootstrap.sh
          FINALPACKAGE=1 gmake clean package messages=yes

      - name: Generate package checksum
        run: |
          shasum -a 256 packages/*.tipa > packages/SHA256SUMS.txt

      - name: Upload TrollStore installer
        uses: actions/upload-artifact@v4
        with:
          name: packages-bootstrap
          path: |
            packages/*.tipa
            packages/SHA256SUMS.txt
          if-no-files-found: error
          retention-days: 7

